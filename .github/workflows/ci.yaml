name: ci

on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version used in generated filenames
        required: true
        default: v0.7.2-catpaw.1
        type: string
      target:
        description: Apple platform artifact(s) to build
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - ios
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  ci:
    name: ci
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Platform info
        run: |
          printf "%-23s %s\n" "ProductName:"    "$(/usr/bin/sw_vers -productName)"
          printf "%-23s %s\n" "ProductVersion:" "$(/usr/bin/sw_vers -productVersion)"
          printf "%-23s %s\n" "BuildVersion:"   "$(/usr/bin/sw_vers -buildVersion)"
          printf "%-23s %s\n" "Arch:"           "$(uname -m)"

      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - name: Show Nix config
        run: nix config show

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      # See ${workspace}/nix/overlays/xcode.nix
      - name: Xcode path
        id: xcode_path
        run: |
          XCODE_PATH=$(realpath /Applications/Xcode_16.1.0.app)

          ${XCODE_PATH}/Contents/Developer/usr/bin/xcodebuild -version

          echo "xcode_path=${XCODE_PATH}" >> $GITHUB_OUTPUT

      - name: Build version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="v0.7.2-catpaw.1"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # See ${workspace}/Makefile
      - name: Build
        env:
          XCODE_PATH: ${{ steps.xcode_path.outputs.xcode_path }}
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ inputs.target }}
        run: |
          case "${PLATFORM:-all}" in
            all)   TARGETS=(macos ios) ;;
            macos) TARGETS=(macos) ;;
            ios)   TARGETS=(ios) ;;
            *) echo "Unsupported platform: ${PLATFORM}" >&2; exit 2 ;;
          esac

          for PLATFORM_NAME in "${TARGETS[@]}"; do
            TARGET="mk-out-archive-xcframeworks-${PLATFORM_NAME}-universal-video-default"
            nix develop -c make XCODE_PATH="${XCODE_PATH}" VERSION="${VERSION}" TARGET="${TARGET}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: |
            result/*.tar.gz
            result/*.zip

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            result/*.tar.gz
            result/*.zip
